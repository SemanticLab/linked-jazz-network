<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Linked Jazz — People network</title>
<meta name="description" content="Who spoke about whom: a network of 43,000 people drawn from 1,300 jazz oral-history interviews in four archives.">
<link rel="icon" href="linked-jazz-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700;800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap">
<link rel="preload" href="graph.data.js" as="fetch" crossorigin="anonymous">
<style>
  /* ---- Linked Jazz design tokens (tokens.json) ---- */
  :root {
    --surface: #f8f7f4; --surface-raised: #ffffff;
    --line: #dcd8d0; --line-strong: #8c877d;
    --ink: #23221f; --ink-muted: #625d55;
    --blue: #4a8ecb; --blue-deep: #2a6ba6; --blue-soft: #e4eef8; --on-blue: #ffffff;
    --danger: #b3261e;
    --node-lime: #afd246; --node-yellow: #ffc549; --node-gold: #ffd03a; --node-green: #81c34a;
    --node-sage: #78a172; --node-periwinkle: #9a95c9; --node-magenta: #ef5d9a; --node-blush: #efcae0;
    --node-peach: #e69775; --node-orange: #f37442; --node-red: #ef3b30;
    --font-sans: "Libre Franklin", "Franklin Gothic Medium", "Helvetica Neue", Arial, sans-serif;
    --font-serif: "Newsreader", Georgia, "Times New Roman", serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-6: 24px; --space-8: 32px; --space-12: 48px;
    --radius-sm: 2px; --radius-md: 4px; --radius-full: 9999px;
    --shadow-float: 0 2px 6px #23221f14, 0 12px 28px -4px #23221f29;
    --focus-ring: 0 0 0 2px #f8f7f4, 0 0 0 4px #4a8ecb;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --surface: #1b1a18; --surface-raised: #242320; --line: #3a3833; --line-strong: #7a756c;
      --ink: #f2efe9; --ink-muted: #aaa49a; --blue-deep: #8dbbe6; --blue-soft: #1f3448; --on-blue: #1b1a18;
      --danger: #f2756c;
      --shadow-float: 0 2px 6px #00000066, 0 12px 28px -4px #000000b3;
      --focus-ring: 0 0 0 2px #1b1a18, 0 0 0 4px #4a8ecb;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --surface: #1b1a18; --surface-raised: #242320; --line: #3a3833; --line-strong: #7a756c;
    --ink: #f2efe9; --ink-muted: #aaa49a; --blue-deep: #8dbbe6; --blue-soft: #1f3448; --on-blue: #1b1a18;
    --danger: #f2756c;
    --shadow-float: 0 2px 6px #00000066, 0 12px 28px -4px #000000b3;
    --focus-ring: 0 0 0 2px #1b1a18, 0 0 0 4px #4a8ecb;
    color-scheme: dark;
  }

  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--surface); color: var(--ink);
    font-family: var(--font-sans); font-size: 15px; line-height: 22px;
    -webkit-font-smoothing: antialiased;
  }
  button, input { font: inherit; color: inherit; }
  a { color: var(--blue-deep); text-decoration: none; }
  a:hover { text-decoration: underline; }
  :focus-visible { outline: none; box-shadow: var(--focus-ring); border-radius: var(--radius-sm); }
  .label { font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-muted); }
  .caption { font-size: 13px; line-height: 18px; color: var(--ink-muted); }

  /* ---- site header (SiteHeader) ---- */
  #header {
    position: fixed; top: 0; left: 0; right: 0; height: 72px; z-index: 10;
    display: flex; align-items: center; gap: var(--space-8); padding: 0 var(--space-8);
    background: var(--surface); border-bottom: 1px solid var(--line);
  }
  .lj-brand { display: flex; align-items: center; gap: var(--space-3); color: var(--ink); font-size: 20px; line-height: 24px; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; }
  .lj-brand:hover { text-decoration: none; }
  .lj-brand img { display: block; width: 40px; height: 41px; }
  .lj-brand small { font-weight: 400; color: var(--ink-muted); font-size: 15px; margin-left: var(--space-2); }
  .lj-nav { display: flex; gap: var(--space-1); list-style: none; padding: 0; }
  .lj-nav a { display: block; padding: var(--space-2) var(--space-3); color: var(--ink); font-weight: 500; border-radius: var(--radius-md); }
  .lj-nav a:hover { color: var(--blue-deep); text-decoration: none; }
  .lj-nav a[aria-current="page"] { color: var(--blue-deep); background: var(--blue-soft); }
  #stats { margin-left: auto; white-space: nowrap; }

  /* SearchField */
  .lj-search { position: relative; display: flex; align-items: center; height: 40px; width: 320px; max-width: 40vw; flex: none;
    background: var(--surface-raised); border: 1px solid var(--line-strong); border-radius: var(--radius-md); transition: border-color 120ms; }
  .lj-search:focus-within { border-color: var(--blue); box-shadow: var(--focus-ring); }
  .lj-search > svg { width: 20px; height: 20px; margin-left: var(--space-3); color: var(--ink-muted); flex: none; }
  .lj-search input { flex: 1; min-width: 0; height: 100%; padding: 0 var(--space-3); border: 0; background: transparent; }
  .lj-search input::placeholder { color: var(--ink-muted); opacity: 1; }
  .lj-search input:focus { outline: none; box-shadow: none; }
  .lj-search input::-webkit-search-cancel-button { -webkit-appearance: none; }
  .lj-search-menu { position: absolute; z-index: 10; top: calc(100% + var(--space-1)); left: -1px; right: -1px; margin: 0; padding: var(--space-1) 0; list-style: none; display: none;
    background: var(--surface-raised); border: 1px solid var(--line); border-radius: var(--radius-md); box-shadow: var(--shadow-float); }
  .lj-search-menu li { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-2) var(--space-3); cursor: pointer; }
  .lj-search-menu li .nm { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lj-search-menu li .deg { font-size: 13px; line-height: 18px; color: var(--ink-muted); white-space: nowrap; }
  .lj-search-menu li:hover, .lj-search-menu li[aria-selected="true"] { background: var(--blue-soft); color: var(--blue-deep); }
  .lj-search-menu li:hover .deg, .lj-search-menu li[aria-selected="true"] .deg { color: var(--blue-deep); }

  .dot { width: 10px; height: 10px; border-radius: var(--radius-full); flex: none; border: 1px solid var(--blue); }

  /* ---- stage ---- */
  #stage { position: fixed; top: 72px; left: 0; right: 0; bottom: 0; background: var(--surface-raised); }
  canvas.layer { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #overlay { pointer-events: none; }

  /* ---- left rail: a card ---- */
  #rail {
    position: fixed; top: 88px; left: var(--space-4); width: 256px; max-height: calc(100% - 136px);
    overflow-y: auto; z-index: 9;
    background: var(--surface-raised); border: 1px solid var(--line); border-radius: var(--radius-md);
    padding: var(--space-2) 0 var(--space-3);
  }
  #rail h3 { padding: var(--space-3) var(--space-4) var(--space-1); }
  #rail label.opt { display: flex; align-items: center; gap: var(--space-2); padding: 3px var(--space-4); cursor: pointer; }
  #rail label.opt:hover { color: var(--blue-deep); }
  #rail .cnt { margin-left: auto; font-size: 13px; color: var(--ink-muted); white-space: nowrap; }
  #rail input[type="checkbox"], #rail input[type="range"] { accent-color: var(--blue-deep); }
  .commrow { display: flex; align-items: center; gap: var(--space-2); padding: 4px var(--space-4); cursor: pointer; }
  .commrow:hover { color: var(--blue-deep); }
  .commrow.active { background: var(--blue-soft); color: var(--blue-deep); }
  .commrow.active .cnt { color: var(--blue-deep); }
  .commrow .nm { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #otherlist .commrow { padding-left: var(--space-8); font-size: 13px; }
  #otherlist .commrow .dot { width: 8px; height: 8px; }
  .slider-row { padding: 2px var(--space-4) var(--space-2); }
  .slider-row .lbl { display: flex; justify-content: space-between; }
  #minn { width: 100%; }
  .lj-btn { display: inline-flex; align-items: center; justify-content: center; height: 32px; padding: 0 var(--space-3);
    font-size: 13px; font-weight: 500; line-height: 1; white-space: nowrap; color: var(--ink);
    background: var(--surface-raised); border: 1px solid var(--line-strong); border-radius: var(--radius-md); cursor: pointer; transition: background-color 120ms; }
  .lj-btn:hover { background: var(--surface); }
  #resetview { margin: var(--space-2) var(--space-4) 0; width: calc(100% - 32px); }

  /* ---- person modal ---- */
  #mback { position: fixed; inset: 0; z-index: 20; display: none; background: #23221f66; align-items: center; justify-content: center; }
  #mback.open { display: flex; }
  #modal {
    width: min(1120px, 95vw); height: min(84vh, 880px);
    background: var(--surface-raised); border: 1px solid var(--line); border-radius: var(--radius-md); box-shadow: var(--shadow-float);
    display: flex; flex-direction: column; overflow: hidden;
  }
  #mhead { display: flex; gap: var(--space-4); align-items: center; padding: var(--space-4) var(--space-6); border-bottom: 1px solid var(--line); position: relative; flex: none; }
  #mclose { position: absolute; top: var(--space-3); right: var(--space-3); width: 32px; height: 32px; background: none; border: none; color: var(--ink-muted); cursor: pointer; border-radius: var(--radius-md); }
  #mclose:hover { color: var(--ink); background: var(--surface); }
  #mclose svg { width: 20px; height: 20px; }
  #mportrait { width: 96px; height: 96px; border-radius: var(--radius-full); flex: none; }
  #mname { font-size: 32px; line-height: 38px; font-weight: 700; letter-spacing: -0.01em; color: var(--ink); }
  .chips { margin-top: var(--space-2); display: flex; flex-wrap: wrap; gap: var(--space-2); }
  .lj-rel { display: inline-flex; align-items: center; gap: var(--space-1); height: 24px; padding: 0 var(--space-2);
    font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap;
    color: var(--ink-muted); background: var(--surface-raised); border: 1px solid var(--line); border-radius: var(--radius-sm); }
  .lj-rel.itv { color: var(--blue-deep); background: var(--blue-soft); border-color: var(--blue-soft); }
  #mstats { padding-top: var(--space-2); }
  #mstats b { font-weight: 600; color: var(--ink); }
  #mlinks { padding-top: var(--space-1); font-size: 13px; line-height: 18px; }
  #mlinks a { margin-right: var(--space-4); cursor: pointer; }

  #mbody { flex: 1; display: flex; min-height: 0; }
  #mrels { flex: 1; overflow-y: auto; padding: var(--space-2) var(--space-6) var(--space-6); min-width: 0; }
  #mrels section { margin-top: var(--space-4); }
  #mrels h4 { margin-bottom: var(--space-2); }
  #mrels h4 .n { font-weight: 400; margin-left: var(--space-2); letter-spacing: 0; text-transform: none; }
  .names { display: inline-flex; flex-wrap: wrap; gap: var(--space-2); vertical-align: middle; }
  .relrow { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); margin-bottom: var(--space-2); }
  .relrow .who { font-weight: 600; color: var(--ink); }
  .relrow .lead { display: inline-flex; align-items: center; gap: var(--space-2); white-space: nowrap; }
  .relrow .reltag { color: var(--blue-deep); background: var(--blue-soft); border-color: var(--blue-soft); }
  .pchip { display: inline-flex; align-items: center; gap: var(--space-2); max-width: 260px; font-size: 13px; line-height: 18px; padding: 3px var(--space-2) 3px 6px;
    border-radius: var(--radius-sm); cursor: pointer; border: 1px solid var(--line); color: var(--ink); background: var(--surface-raised); transition: border-color 120ms; }
  .pchip:hover { border-color: var(--line-strong); }
  .pchip.sel { border-color: var(--blue-soft); background: var(--blue-soft); color: var(--blue-deep); }
  .pchip .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pchip .dir, .pchip .xn { color: var(--ink-muted); font-size: 12px; }
  .pchip.sel .dir, .pchip.sel .xn { color: var(--blue-deep); }
  .morebtn { height: 26px; font-size: 12px; padding: 0 var(--space-2); border-style: dashed; color: var(--ink-muted); }

  /* evidence pane: Transcript blocks */
  #mev { width: 0; flex: none; border-left: 1px solid var(--line); overflow-y: auto; transition: width 150ms ease; background: var(--surface); }
  #mev.open { width: 440px; }
  #mev .evhead { position: sticky; top: 0; z-index: 2; padding: var(--space-3) var(--space-4); background: var(--surface); border-bottom: 1px solid var(--line); font-weight: 600; }
  #mev .evhead small { display: block; font-weight: 400; margin-top: 2px; }
  .lj-transcript { margin: var(--space-4); padding: var(--space-4); background: var(--surface-raised); border: 1px solid var(--line); border-radius: var(--radius-md); }
  .lj-transcript .src { margin-bottom: var(--space-2); }
  .lj-transcript .src b { font-weight: 600; color: var(--ink); }
  .lj-transcript .speaker { display: block; margin: 0 0 var(--space-2); font-size: 17px; line-height: 24px; font-weight: 600; color: var(--ink); }
  .lj-transcript p.q { font-family: var(--font-serif); font-size: 19px; line-height: 30px; color: var(--ink); margin: 0 0 var(--space-3); }
  .turn { margin-bottom: var(--space-2); font-family: var(--font-serif); font-size: 16px; line-height: 24px; color: var(--ink); }
  .turn.src0 { color: var(--ink-muted); }
  .turn .sp { font-family: var(--font-sans); font-size: 13px; font-weight: 600; color: var(--ink); margin-right: var(--space-1); }
  .turn.src0 .sp { color: var(--ink-muted); }
  mark { background: none; color: var(--blue-deep); text-decoration: underline; text-decoration-color: var(--blue); text-underline-offset: 3px; }
  .lj-transcript footer { display: flex; justify-content: space-between; flex-wrap: wrap; gap: var(--space-2) var(--space-4); margin-top: var(--space-3); padding-top: var(--space-2); border-top: 1px solid var(--line); font-family: var(--font-sans); }
  .evload { padding: var(--space-6) var(--space-4); }

  /* ---- community card (shown while a community is isolated) ---- */
  #commcard { position: fixed; top: 88px; right: var(--space-4); width: 360px; max-width: calc(100% - 32px); max-height: calc(100% - 136px); overflow-y: auto; z-index: 9;
    display: none; background: var(--surface-raised); border: 1px solid var(--line); border-radius: var(--radius-md); padding: var(--space-4); }
  #commcard.open { display: block; }
  #commcard .close { position: absolute; top: var(--space-2); right: var(--space-2); width: 28px; height: 28px; background: none; border: none; color: var(--ink-muted); cursor: pointer; border-radius: var(--radius-md); }
  #commcard .close:hover { color: var(--ink); background: var(--surface); }
  #commcard .close svg { width: 18px; height: 18px; }
  #commcard h2 { font-size: 22px; line-height: 28px; font-weight: 700; padding-right: var(--space-8); display: flex; gap: var(--space-2); align-items: center; }
  #commcard h2 .dot { width: 12px; height: 12px; }
  #commcard .meta { margin-top: var(--space-1); }
  #commcard .scene { margin-top: var(--space-2); font-style: normal; }
  #commcard .summary { margin-top: var(--space-3); font-family: var(--font-serif); font-size: 17px; line-height: 26px; }
  #commcard h4 { margin: var(--space-4) 0 var(--space-2); }
  #commcard .figs { display: flex; flex-wrap: wrap; gap: var(--space-2); }
  #commcard .figs .pchip.off { opacity: 0.6; cursor: default; }
  #commcard .conf { margin-top: var(--space-3); }
  @media (max-width: 720px) { #commcard { top: auto; bottom: 40px; max-height: 45vh; } }

  /* ---- footer ---- */
  #footer { position: fixed; left: 0; right: 0; bottom: 0; height: 32px; z-index: 8; display: flex; align-items: center; gap: var(--space-4); padding: 0 var(--space-4);
    pointer-events: none; }
  #footer span { background: var(--surface-raised); padding: 2px var(--space-2); border-radius: var(--radius-sm); }
  #loading { position: fixed; top: 72px; left: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center; z-index: 5; }
  #loading .box { display: flex; align-items: center; gap: var(--space-3); }
  #loading .ring { width: 20px; height: 20px; border-radius: var(--radius-full); border: 2px solid var(--line); border-top-color: var(--blue); animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  ::-webkit-scrollbar { width: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: var(--radius-full); border: 2px solid var(--surface-raised); }
  ::-webkit-scrollbar-track { background: transparent; }

  @media (max-width: 720px) {
    #header { gap: var(--space-3); padding: 0 var(--space-4); }
    .lj-brand small, #stats, .lj-nav { display: none; }
    .lj-search { max-width: none; flex: 1; }
    #rail { width: calc(100% - 32px); max-height: 36vh; }
    #modal { width: 100vw; height: 100%; border-radius: 0; }
    #mev.open { width: 100%; position: absolute; inset: 0; z-index: 3; }
    #mname { font-size: 22px; line-height: 28px; }
  }
</style>
</head>
<body>
<header id="header">
  <a class="lj-brand" href="./"><img src="linked-jazz-mark.png" alt="">Linked Jazz<small>People network</small></a>
  <nav aria-label="Main"><ul class="lj-nav">
    <li><a href="./" aria-current="page">People</a></li>
    <li><a href="https://semlab.io/linked-jazz-transcripts/">Oral histories</a></li>
  </ul></nav>
  <span id="stats" class="caption"></span>
  <form class="lj-search" role="search" id="searchwrap" onsubmit="return false">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M9 3.75a5.25 5.25 0 1 1 0 10.5 5.25 5.25 0 0 1 0-10.5Zm3.75 9 3.5 3.5"/></svg>
    <input id="search" type="search" placeholder="Search for a musician" aria-label="Search for a musician" autocomplete="off" spellcheck="false">
    <ul id="results" class="lj-search-menu" role="listbox"></ul>
  </form>
</header>

<div id="stage">
  <canvas id="scene" class="layer"></canvas>
  <canvas id="overlay" class="layer"></canvas>
</div>

<aside id="rail" aria-label="Filters">
  <h3 class="label">Communities</h3>
  <div id="commlist"></div>
  <h3 class="label">Relationships</h3>
  <div id="rellist"></div>
  <div class="slider-row">
    <div class="lbl caption"><span>Corroboration</span><span id="minnlbl">≥ 1 interview</span></div>
    <input id="minn" type="range" min="1" max="5" step="1" value="1" aria-label="Minimum interviews corroborating a relationship">
  </div>
  <h3 class="label">Archives</h3>
  <div id="instlist"></div>
  <h3 class="label">Display</h3>
  <label class="opt"><input id="showsing" type="checkbox" checked> People mentioned once</label>
  <label class="opt"><input id="hideunc" type="checkbox" checked> Hide unconnected people</label>
  <button id="resetview" class="lj-btn">Reset view</button>
</aside>

<aside id="commcard" aria-live="polite">
  <button class="close" id="commclose" aria-label="Close"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15"/></svg></button>
  <h2 id="commtitle"></h2>
  <div class="meta caption" id="commmeta"></div>
  <div class="scene caption" id="commscene"></div>
  <p class="summary" id="commsummary"></p>
  <h4 class="label" id="commfigshead">Key figures</h4>
  <div class="figs" id="commfigs"></div>
  <div class="conf caption" id="commconf"></div>
</aside>

<div id="mback">
  <div id="modal" role="dialog" aria-modal="true" aria-labelledby="mname">
    <div id="mhead">
      <button id="mclose" aria-label="Close"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15"/></svg></button>
      <canvas id="mportrait" width="192" height="192"></canvas>
      <div style="min-width:0">
        <h2 id="mname"></h2>
        <div class="chips" id="mchips"></div>
        <div id="mstats" class="caption"></div>
        <div id="mlinks"></div>
      </div>
    </div>
    <div id="mbody">
      <div id="mrels"></div>
      <div id="mev"></div>
    </div>
  </div>
</div>

<div id="footer" class="caption">
  <span id="viscount"></span>
  <span>Scroll to zoom · drag to pan · click a person</span>
</div>

<div id="loading"><div class="box caption"><span class="ring"></span><span id="loadmsg">Loading the network…</span></div></div>

<script src="atlas.data.js?v=9"></script>
<script src="labels.data.js?v=9"></script>
<script src="app.js?v=9"></script>
</body>
</html>
